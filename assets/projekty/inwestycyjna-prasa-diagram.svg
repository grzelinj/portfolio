<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 385" width="1400" height="385" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="cardfill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161d33"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="385" fill="#0a0e1c"/>

  <text x="700" y="26" text-anchor="middle" fill="#a9b8ff" font-size="13" font-weight="500" letter-spacing="2">HARMONOGRAM → ZBIERZ → PODSUMUJ (CLAUDE HAIKU) → WYŚLIJ</text>

  <!-- Box 1: Schedule -->
  <rect x="24" y="60" width="248" height="265" rx="14" fill="url(#cardfill2)" stroke="#a9b8ff" stroke-opacity="0.18"/>
  <text x="148" y="150" text-anchor="middle" font-size="30">⏰</text>
  <text x="148" y="195" text-anchor="middle" fill="#e8ecf6" font-size="17" font-weight="700">GitHub Actions</text>
  <text x="148" y="218" text-anchor="middle" fill="#8f9bc2" font-size="12">codziennie 16:00</text>
  <text x="148" y="236" text-anchor="middle" fill="#8f9bc2" font-size="12">Europe/Warsaw</text>

  <text x="300" y="200" text-anchor="middle" fill="#5c6690" font-size="22">→</text>

  <!-- Box 2: Collect -->
  <rect x="326" y="60" width="248" height="265" rx="14" fill="url(#cardfill2)" stroke="#a9b8ff" stroke-opacity="0.18"/>
  <text x="450" y="150" text-anchor="middle" font-size="30">📡</text>
  <text x="450" y="195" text-anchor="middle" fill="#e8ecf6" font-size="17" font-weight="700">Zbierz nowości</text>
  <text x="450" y="218" text-anchor="middle" fill="#8f9bc2" font-size="12">YouTube RSS +</text>
  <text x="450" y="236" text-anchor="middle" fill="#8f9bc2" font-size="12">Telegram (Telethon)</text>

  <text x="602" y="200" text-anchor="middle" fill="#5c6690" font-size="22">→</text>

  <!-- Box 3: Summarize (wider) -->
  <rect x="628" y="60" width="290" height="265" rx="14" fill="url(#cardfill2)" stroke="#bcc9ff" stroke-opacity="0.32"/>
  <text x="773" y="150" text-anchor="middle" font-size="30">🧠</text>
  <text x="773" y="195" text-anchor="middle" fill="#e8ecf6" font-size="17" font-weight="700">Claude (Haiku)</text>
  <text x="773" y="218" text-anchor="middle" fill="#bcc9ff" font-size="12">transkrypcja + dedup (SQLite)</text>
  <text x="773" y="236" text-anchor="middle" fill="#8f9bc2" font-size="12">wybiera, co warte uwagi</text>

  <text x="944" y="200" text-anchor="middle" fill="#5c6690" font-size="22">→</text>

  <!-- Box 4: Deliver -->
  <rect x="970" y="60" width="248" height="265" rx="14" fill="url(#cardfill2)" stroke="#a9b8ff" stroke-opacity="0.18"/>
  <text x="1094" y="150" text-anchor="middle" font-size="30">📨</text>
  <text x="1094" y="195" text-anchor="middle" fill="#e8ecf6" font-size="17" font-weight="700">Telegram — wyślij</text>
  <text x="1094" y="218" text-anchor="middle" fill="#8f9bc2" font-size="12">jedna wiadomość</text>
  <text x="1094" y="236" text-anchor="middle" fill="#8f9bc2" font-size="12">nagłówki + szczegóły</text>

  <text x="1250" y="200" text-anchor="middle" fill="#5c6690" font-size="22">→</text>

  <!-- Box 5: Result -->
  <rect x="1300" y="130" width="76" height="125" rx="12" fill="none" stroke="#5c6690" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <text x="1338" y="185" text-anchor="middle" font-size="24">📰</text>
  <text x="1338" y="220" text-anchor="middle" fill="#8f9bc2" font-size="10">jeden</text>
  <text x="1338" y="234" text-anchor="middle" fill="#8f9bc2" font-size="10">digest</text>
</svg>
